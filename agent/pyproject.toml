[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agent"
version = "0.1.0"
description = "Autonomous web application security research agent integrating with Burp Suite MCP"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
security-agent = "security_agent.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["security_agent*"]
